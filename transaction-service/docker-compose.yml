version: "3.9"

services:
  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/transactions.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=esprit-realm
      - KEYCLOAK_CLIENT_ID=transaction-service
      - USER_SERVICE_URL=http://user-service:8082
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_EXCHANGE=app.events
      - RABBITMQ_TRANSACTION_QUEUE=transaction.completed
      - CORS_ORIGINS=http://localhost:4200
    volumes:
      - transaction_data:/app/data
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Attach to these if running standalone (remove if using a shared compose) ──
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - microservices-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  transaction_data:
  rabbitmq_data:

networks:
  microservices-net:
    driver: bridge
    name: microservices-net
