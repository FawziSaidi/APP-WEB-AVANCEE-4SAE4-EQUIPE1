spring.application.name=user-service
server.port=8081

# ??? Base de données ????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/web_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
