# Application
spring.application.name=lesson-service
server.port=9001

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/lesson_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Security (Keycloak)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/pidev-realm/protocol/openid-connect/certs

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.user=user.exchange
rabbitmq.exchange.lesson=lesson.exchange
rabbitmq.queue.user.created=user.created.queue
rabbitmq.queue.lesson.completed=lesson.completed.queue
rabbitmq.routing-key.lesson.completed=lesson.completed

# Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000