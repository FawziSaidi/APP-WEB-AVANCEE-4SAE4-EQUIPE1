spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ProlanceRealm

  cloud:
    gateway:
      routes:
        # ══════════════════════════════════════════
        # USER SERVICE
        # ══════════════════════════════════════════
        - id: user-service-auth
          uri: lb://user-service
          predicates: [Path=/api/auth/**]
          filters: [StripPrefix=0]

        - id: user-service-users
          uri: lb://user-service
          predicates: [Path=/users/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # ══════════════════════════════════════════
        # PUBLICATION SERVICE
        # ══════════════════════════════════════════
        - id: publication-service
          uri: lb://publication-service
          predicates: [Path=/api/publications/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: publication-uploads
          uri: lb://publication-service
          predicates: [Path=/uploads/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # ══════════════════════════════════════════
        # COMMENTAIRE SERVICE
        # ══════════════════════════════════════════
        - id: commentaire-service
          uri: lb://commentaire-service
          predicates: [Path=/api/commentaires/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # ══════════════════════════════════════════
        # REACTION SERVICE
        # ══════════════════════════════════════════
        - id: reaction-service
          uri: lb://reaction-service
          predicates: [Path=/api/reactions/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # ══════════════════════════════════════════
        # TRANSACTION SERVICE (Python/FastAPI)
        # ══════════════════════════════════════════
        - id: transaction-service
          uri: http://transaction-service:8086
          predicates: [Path=/api/transactions/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # ══════════════════════════════════════════
        # ADS SERVICE
        # ══════════════════════════════════════════
        - id: ads-campaigns
          uri: lb://ads-service
          predicates: [Path=/api/campaigns/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: ads-plans
          uri: lb://ads-service
          predicates: [Path=/api/plans/**]
          filters:
            - StripPrefix=0

        # ══════════════════════════════════════════
        # SUBSCRIPTION SERVICE
        # ══════════════════════════════════════════
        - id: subscription-service-subscriptions
          uri: lb://subscription-service
          predicates: [Path=/api/subscriptions/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: subscription-service-user-subscriptions
          uri: lb://subscription-service
          predicates: [Path=/api/user-subscriptions/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: subscription-service-promos
          uri: lb://subscription-service
          predicates: [Path=/api/promos/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: subscription-service-payments
          uri: lb://subscription-service
          predicates: [Path=/api/payments/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: subscription-service-stats
          uri: lb://subscription-service
          predicates: [Path=/api/subscription-stats/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: subscription-service-recommendations
          uri: lb://subscription-service
          predicates: [Path=/api/recommendations/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: subscription-service-churn
          uri: lb://subscription-service
          predicates: [Path=/api/churn/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

server:
  port: 8222

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG