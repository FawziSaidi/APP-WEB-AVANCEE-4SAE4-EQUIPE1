spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ProlanceRealm

  cloud:
    gateway:
      routes:
        # -- USER SERVICE --
        - id: user-service-auth
          uri: lb://user-service
          predicates: [Path=/api/auth/**]
          filters: [StripPrefix=0]

        - id: user-service-users
          uri: lb://user-service
          predicates: [Path=/users/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # -- PUBLICATION SERVICE --
        - id: publication-service
          uri: lb://publication-service
          predicates: [Path=/api/publications/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: publication-uploads
          uri: lb://publication-service
          predicates: [Path=/uploads/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # -- COMMENTAIRE SERVICE --
        - id: commentaire-service
          uri: lb://commentaire-service
          predicates: [Path=/api/commentaires/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # -- REACTION SERVICE --
        - id: reaction-service
          uri: lb://reaction-service
          predicates: [Path=/api/reactions/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        # -- TRANSACTION SERVICE (Python/FastAPI - direct URI, not on Eureka) --
        - id: transaction-service
          uri: http://transaction-service:8086
          predicates: [Path=/api/transactions/**]
          filters:
            - StripPrefix=0

        # -- ADS SERVICE --
        - id: ads-campaigns
          uri: lb://ads-service
          predicates: [Path=/api/campaigns/**]
          filters:
            - StripPrefix=0
            - TokenRelay=

        - id: ads-plans
          uri: lb://ads-service
          predicates: [Path=/api/plans/**]
          filters:
            - StripPrefix=0

server:
  port: 8222

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
