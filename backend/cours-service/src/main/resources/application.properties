# Application Name
spring.application.name=course-service

# Server port
server.port=9002
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lesson_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Security / Keycloak (ADD THIS!)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/pidev-realm/protocol/openid-connect/certs

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Feign Client
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000