<div class="main-content">
  <div class="container-fluid">

    <!-- Header -->
    <div class="row mb-4">
      <div class="col-12">
        <h3><i class="material-icons" style="vertical-align:middle;">payments</i> Transactions</h3>
      </div>
    </div>

    <!-- Toast -->
    <div *ngIf="showToast" class="alert" [ngClass]="toastType === 'success' ? 'alert-success' : 'alert-danger'"
         style="position:fixed;top:20px;right:20px;z-index:9999;min-width:300px;">
      {{ toastMessage }}
    </div>

    <div class="row">
      <!-- Send Money Form -->
      <div class="col-md-5">
        <div class="card">
          <div class="card-header card-header-primary">
            <h4 class="card-title">Send Money</h4>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label>Receiver User ID *</label>
              <input type="text" class="form-control" [(ngModel)]="receiverId" placeholder="Enter receiver's user ID">
            </div>
            <div class="form-group">
              <label>Amount *</label>
              <input type="number" class="form-control" [(ngModel)]="amount" placeholder="0.00" min="0.01" step="0.01">
            </div>
            <div class="form-group">
              <label>Currency</label>
              <select class="form-control" [(ngModel)]="currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="TND">TND</option>
              </select>
            </div>
            <div class="form-group">
              <label>Reference</label>
              <input type="text" class="form-control" [(ngModel)]="reference" placeholder="Payment reference">
            </div>
            <button class="btn btn-primary btn-block" (click)="sendTransaction()"
                    [disabled]="isSending || !receiverId.trim() || !amount || amount <= 0">
              <i class="material-icons" style="vertical-align:middle;">send</i>
              {{ isSending ? 'Sending...' : 'Send Transaction' }}
            </button>
          </div>
        </div>
      </div>

      <!-- Transaction History -->
      <div class="col-md-7">
        <div class="card">
          <div class="card-header card-header-info">
            <h4 class="card-title">Transaction History</h4>
          </div>
          <div class="card-body">
            <div *ngIf="isLoading" class="text-center py-4">
              <i class="material-icons spin" style="font-size:36px;">autorenew</i>
              <p>Loading...</p>
            </div>

            <div *ngIf="!isLoading && transactions.length === 0" class="text-center py-4">
              <i class="material-icons" style="font-size:48px;color:#ccc;">receipt_long</i>
              <p class="text-muted">No transactions yet</p>
            </div>

            <div class="table-responsive" *ngIf="!isLoading && transactions.length > 0">
              <table class="table">
                <thead class="text-primary">
                  <tr>
                    <th>Date</th>
                    <th>Receiver</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Reference</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let tx of transactions">
                    <td>{{ tx.created_at | date:'short' }}</td>
                    <td>{{ tx.receiver_id }}</td>
                    <td><strong>{{ tx.amount }} {{ tx.currency }}</strong></td>
                    <td>
                      <span class="badge" [ngClass]="tx.status === 'COMPLETED' ? 'badge-success' : 'badge-warning'">
                        {{ tx.status }}
                      </span>
                    </td>
                    <td>{{ tx.reference }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
