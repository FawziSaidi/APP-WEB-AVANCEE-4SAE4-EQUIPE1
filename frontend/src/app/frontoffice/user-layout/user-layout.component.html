<nav class="user-navbar" [class.scrolled]="navbarScrolled">
  <div class="container navbar-inner">

    <a class="navbar-brand" routerLink="/app/dashboard">
      <img src="assets/img/prolance.png" alt="Prolance" class="brand-logo" />
      <span class="brand-text">Prolance</span>
    </a>

    <button class="navbar-toggler" (click)="toggleMobileMenu()">
      <i class="material-icons">{{ mobileMenuOpen ? 'close' : 'menu' }}</i>
    </button>

    <div class="navbar-links" [class.open]="mobileMenuOpen">
      <a class="nav-link" routerLink="/app/dashboard" routerLinkActive="active" (click)="mobileMenuOpen = false">
        <i class="material-icons">dashboard</i> Dashboard
      </a>
      <a class="nav-link" routerLink="/app/forum" routerLinkActive="active" (click)="mobileMenuOpen = false">
        <i class="material-icons">forum</i> Forum
      </a>
      <a class="nav-link" routerLink="/app/ads" routerLinkActive="active" (click)="mobileMenuOpen = false">
        <i class="material-icons">campaign</i> Publicite
      </a>
      <a class="nav-link" routerLink="/app/transactions" routerLinkActive="active" (click)="mobileMenuOpen = false">
        <i class="material-icons">payments</i> Transactions
      </a>
    </div>

    <div class="navbar-right">
      <div class="role-badge-group">
        <span class="role-badge" [class.active]="isFreelancer">Freelancer</span>
        <span class="role-badge" [class.active]="isClient">Client</span>
      </div>

      <div class="profile-dropdown-wrapper">
        <button class="profile-avatar" (click)="toggleProfileDropdown()">
          <i class="material-icons">person</i>
        </button>
        <div class="profile-dropdown" [class.open]="profileDropdownOpen">
          <div class="dropdown-header">
            <div class="dropdown-avatar">{{ userInitials }}</div>
            <div class="dropdown-user-info">
              <span class="dropdown-name">{{ userName || 'Loading...' }}</span>
              <span class="dropdown-email">{{ userEmail }}</span>
              <span class="dropdown-role">{{ currentRole | titlecase }}</span>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item logout-item" (click)="logout(); profileDropdownOpen = false">
            <i class="material-icons">logout</i> Logout
          </a>
        </div>
      </div>
    </div>

  </div>
</nav>

<main class="user-main">
  <router-outlet></router-outlet>
</main>

<footer class="user-footer">
  <div class="container">
    <div class="footer-inner">
      <span class="footer-brand">&copy; {{ currentYear }} <strong>Prolance</strong></span>
      <span class="footer-links">
        <a href="javascript:void(0)">Terms</a>
        <a href="javascript:void(0)">Privacy</a>
        <a href="javascript:void(0)">Support</a>
      </span>
    </div>
  </div>
</footer>
